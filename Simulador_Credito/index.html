<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Simulación de Crédito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="encabezado">
      <h1>Simulador de Crédito Personal</h1>
      <img class="logo" src="logo.png" alt="Logo de Banco RMR">
    </header>
    <h2>Banco RMR</h2>
    <form id="credit-form">
      <label for="nombre-cliente">Nombre del cliente:</label>
      <input type="text" id="nombre-cliente" name="nombre-cliente" autocomplete="name" placeholder="Escribe el nombre completo">

      <label for="monto">Monto del Crédito Solicitado ($):</label>
      <input type="number" id="monto" value="150000" required>

      <label for="tasa">Tasa de Interés Anual Ordinaria (%):</label>
      <input type="number" id="tasa" value="34" step="0.1" required>

      <label for="plazo">Plazo del Financiamiento (Meses):</label>
      <select id="plazo">
        <option value="12">12 meses</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48" selected>48 meses</option>
      </select>

      <button type="button" id="btn-calcular">Calcular Amortización</button>
    </form>

    <table id="tabla-amortizacion">
      <thead>
        <tr>
          <th scope="col">Mes</th>
          <th scope="col">Saldo Inicial</th>
          <th scope="col">Capital</th>
          <th scope="col">Interés</th>
          <th scope="col">IVA (16%)</th>
          <th scope="col">Pago Total</th>
          <th scope="col">Saldo Final</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filas generadas dinámicamente mediante JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
